name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-24.04

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}

    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Force build when manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected. Forcing build."
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git checkout origin/update -- build.md; then
            echo "First time building!"
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            UPDATE_CFG=$(./build.sh config.toml --config-update)

            echo "UPDATE_CFG='$UPDATE_CFG'"

            if [ -n "$UPDATE_CFG" ]; then
              echo "Update detected. Building..."
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            else
              echo "No update detected."
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

  build:
    permissions: write-all
    needs: check
    if: ${{ needs.check.outputs.SHOULD_BUILD == '1' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit